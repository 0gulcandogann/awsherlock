[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "awsherlock"
dynamic = ["version"]
description = "Open-source AWS security scanner with evidence-aware investigations and standalone reports."
keywords = ["aws", "security", "scanner", "cloud"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security"
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "AWSherlock Contributors" }
]
dependencies = [
  "boto3>=1.43.94,<2",
  "typer>=0.12,<1.0",
  "rich>=13,<15",
  "jinja2>=3.1,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "build>=1.2,<2",
  "hatchling>=1.26,<2",
  "ruff==0.17.1",
  "black==26.10.1"
]

[project.scripts]
awsherlock = "awsherlock.cli:app"

[project.urls]
Documentation = "https://github.com/0gulcandogann/awsherlock#readme"
Repository = "https://github.com/0gulcandogann/awsherlock"
Issues = "https://github.com/0gulcandogann/awsherlock/issues"

[tool.hatch.version]
path = "src/awsherlock/__init__.py"

[tool.pytest.ini_options]
markers = ["browser: requires a working local Chromium, Chrome or Edge process"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/awsherlock"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/SECURITY.md", "/Dockerfile", "/.dockerignore", "/install.sh", "/pyproject.toml"]
