[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awsherlock"
dynamic = ["version"]
description = "Open-source AWS security scanner with standalone security reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "AWSherlock Contributors" }
]
dependencies = [
  "boto3>=1.34,<2",
  "typer>=0.12,<1.0",
  "rich>=13,<15"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7"
]

[project.scripts]
awsherlock = "awsherlock.cli:app"

[tool.hatch.version]
path = "src/awsherlock/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/awsherlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
