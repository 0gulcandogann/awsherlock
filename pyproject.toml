[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awsherlock"
dynamic = ["version"]
description = "Open-source AWS security scanner with standalone security reports."
keywords = ["aws", "security", "scanner", "cloud"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security"
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "AWSherlock Contributors" }
]
dependencies = [
  "boto3>=1.43.94,<2",
  "typer>=0.12,<1.0",
  "rich>=13,<15",
  "jinja2>=3.1,<4"
]

[project.scripts]
awsherlock = "awsherlock.cli:app"

[project.urls]
Repository = "https://github.com/0gulcandogann/awsherlock"
Issues = "https://github.com/0gulcandogann/awsherlock/issues"

[tool.hatch.version]
path = "src/awsherlock/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/awsherlock"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/docs", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/Dockerfile", "/.dockerignore", "/install.sh", "/pyproject.toml"]
